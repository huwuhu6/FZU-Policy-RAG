# FZU Retrieval Benchmark v1. This profile never imports or rebuilds a corpus.
# Database, Redis, Milvus host, and credentials are inherited from the local
# application.properties/environment; no personal path or secret is embedded.

spring.ai.model.chat=openai
spring.ai.openai.api-key=${DASHSCOPE_API_KEY:}
spring.ai.openai.base-url=${DASHSCOPE_OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
spring.ai.openai.chat.options.model=${DASHSCOPE_CHAT_MODEL:qwen-flash}

spring.ai.vectorstore.milvus.initialize-schema=false
spring.ai.vectorstore.milvus.collection-name=fzu_policy_rag_baseline_v1
rag.milvus.force-rebuild=false

rag.embedding.base-url=${DASHSCOPE_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
rag.embedding.api-key=${DASHSCOPE_API_KEY:}
rag.embedding.model=${DASHSCOPE_EMBEDDING_MODEL:qwen3.7-text-embedding-flash}
rag.embedding.dimension=1024
rag.embedding.timeout-ms=30000
rag.rerank.url=${DASHSCOPE_RERANK_URL:https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank}
rag.rerank.api-key=${DASHSCOPE_API_KEY:}
rag.rerank.model=${DASHSCOPE_RERANK_MODEL:qwen3.7-text-rerank}
rag.rerank.timeout-ms=10000

rag.retrieval.dense-topk=50
rag.retrieval.hybrid-topk=80
rag.retrieval.rerank-topk=40
rag.retrieval.rerank-score-threshold=0.30
rag.retrieval.final-child-topk=10

rag.benchmark.dataset-name=fzu-policy-retrieval-v1
rag.benchmark.dataset-file=classpath:evaluation/fzu_policy_retrieval_v1.json
rag.benchmark.dataset-manifest=classpath:evaluation/fzu_policy_retrieval_v1.manifest.json
rag.benchmark.top-k=10
rag.benchmark.rerank-top-k=40
rag.benchmark.sample-size=30
rag.benchmark.concurrency=1
rag.benchmark.retries=1
rag.benchmark.retrieval-timeout-ms=30000
rag.benchmark.output-dir=evaluation_results/fzu
rag.benchmark.auto-import-corpus=false
rag.benchmark.run-generation=false
